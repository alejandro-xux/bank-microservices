# CI de bank-microservices (BANK-83, medida en el spike BANK-82). Cada PR a main corre las pruebas de los 7 módulos en
# paralelo, y protect-main exige el check ci-ok para mergear. Cada módulo es un proyecto Gradle propio (con
# includeBuild de platform-bom y contracts), así que se prueba completo en su job: siempre todos, porque un cambio en
# contracts o en el BOM afecta a los demás
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo leer el repo: este workflow no publica nada
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior (ya quedó vieja). En main nunca se cancela: cada merge se prueba
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    # Sin esto, un contenedor colgado tendría el job corriendo hasta 6 horas
    timeout-minutes: 20
    strategy:
      # Que un módulo que falla no cancele a los demás: el PR muestra todo lo que está roto de una vez
      fail-fast: false
      matrix:
        module:
          - contracts
          - customers-service
          - accounts-service
          - notifications-service
          - api-gateway
          - config-server
          - discovery-server
    steps:
      # Versiones fijadas por commit (un tag se puede mover); Dependabot las actualiza (BANK-85)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caché de Gradle: solo la escribe main y los PR la leen (spike: 3:33 en frío, 2:51 en caliente)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Las imágenes de Testcontainers las baja cada prueba al arrancar (4-13 s por módulo, no vale cachearlas)
      - name: Pruebas
        working-directory: ${{ matrix.module }}
        run: ./gradlew test --no-daemon

      - name: Resumen
        if: always()
        run: python3 -I .github/scripts/test-summary.py "${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY"

      # Lo que necesita el análisis único de Sonar (BANK-84): clases de main y de pruebas, y la cobertura de JaCoCo
      - name: Insumos para Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/classes/java/main
            ${{ matrix.module }}/build/classes/java/test
            ${{ matrix.module }}/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/
          retention-days: 7

  # SonarCloud (BANK-84, spike BANK-82 Q5): UN análisis del repo entero cuando las pruebas pasaron. La configuración
  # está en sonar-project.properties; este job solo le agrega las rutas de los jars, que dependen de esta máquina.
  # No corre si el PR viene de un fork o de Dependabot: GitHub no les pasa los secrets (sin SONAR_TOKEN fallaría)
  sonar:
    name: sonar
    needs: test
    if: >-
      needs.test.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar necesita la historia para saber qué código es nuevo en el PR
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Las rutas de los jars de cada módulo en esta máquina (tarea sonarLibraries de gradle/quality.gradle), UNO POR UNO:
      # en paralelo, cinco builds compilaban a la vez el mismo contracts (includeBuild) en la misma carpeta y chocaban.
      # Se agregan a sonar-project.properties (solo en esta copia del repo): son ~125 KB, y como argumento de la action
      # pasarían por una sola variable de entorno, que Linux corta en 128 KB
      - name: Dependencias de cada módulo
        run: |
          modules="contracts customers-service accounts-service notifications-service api-gateway config-server discovery-server"
          for m in $modules; do (cd "$m" && ./gradlew -q sonarLibraries --no-daemon); done
          # El echo cierra la última ruta de cada módulo: sin él se pegaba con la primera del siguiente
          join() { for m in $modules; do tr ',' '\n' < "$m/build/sonar/$1"; echo; done | grep . | sort -u | paste -sd, -; }
          echo "sonar.java.libraries=$(join libraries.txt)" >> sonar-project.properties
          echo "sonar.java.test.libraries=$(join test-libraries.txt)" >> sonar-project.properties

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-*
          path: sonar-inputs

      - name: Análisis y Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Secretos (BANK-85): el repo es público, un secreto que llega a main ya se publicó. Revisa TODO el historial en cada
  # corrida (el repo es chico: segundos), así nada se escapa aunque haya entrado antes. Con --redact: si encuentra
  # algo, el log público no muestra el secreto
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 publicado en el release oficial (gitleaks_8.30.1_checksums.txt): si el binario no coincide, no se usa
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versión y checksum fijos)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Prueba al revés que corre siempre: una clave de AWS falsa, generada aquí y nunca escrita en el repo, en un repo
      # temporal de esta máquina. Si gitleaks no la ve, el detector no sirve y la CI no puede dar verde
      - name: Canario (gitleaks detecta una clave plantada)
        run: |
          canary=$(mktemp -d)
          git -C "$canary" init -q
          echo "aws_access_key_id = AKIA$(tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)" > "$canary/config.ini"
          git -C "$canary" add . && git -C "$canary" -c user.name=ci -c user.email=ci@ci commit -qm canario
          if "$RUNNER_TEMP/gitleaks" git "$canary" --no-banner --redact > /dev/null 2>&1; then
            echo "::error::gitleaks no detectó la clave plantada en el canario"; exit 1
          fi
          echo "El canario funciona: gitleaks detectó la clave plantada"

      - name: Secretos en todo el historial
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact --verbose

  # Contratos (BANK-86): buf compara los .proto con los de main y frena un cambio incompatible (un campo renumerado o
  # borrado, otro tipo, un RPC quitado). Corre siempre (unos segundos): sin cambios en contracts, no hay nada que frenar
  buf:
    name: buf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUF_VERSION: 1.73.0
      # sha256 publicado en el release oficial (sha256.txt): si el binario no coincide, no se usa
      BUF_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar buf (versión y checksum fijos)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"

      - name: Lint
        run: |
          "$RUNNER_TEMP/buf" lint contracts

      # En un PR, contra la rama base; en main, contra el commit anterior al push
      - name: Compatibilidad con la versión anterior
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "Comparando contracts con $BASE"
          "$RUNNER_TEMP/buf" breaking contracts --against ".git#ref=${BASE},subdir=contracts"

  # El único check que exige protect-main: si mañana hay 8 módulos, la ruleset no cambia. Corre SIEMPRE y falla a
  # propósito si la matriz no terminó en success: un job saltado o cancelado cuenta como "pasó" para GitHub
  # Desde BANK-84 también exige el Quality Gate: Sonar tiene que haber pasado, salvo en un PR de un fork o de
  # Dependabot, donde no puede correr (no hay secrets) y queda "skipped". Desde BANK-85, también gitleaks; desde BANK-86, buf
  # Imágenes de los servicios (BANK-95): se construyen en cada PR (no se publican: eso llega con ACR en E12) y no pasan
  # si el Dockerfile tiene un problema (hadolint), si la imagen corre como root, no tiene HEALTHCHECK o lleva una
  # credencial (infra/build-images.sh), o si trae una vulnerabilidad CRITICAL o HIGH que ya tiene arreglo (Trivy, D7)
  images:
    name: imagen ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - customers-service
          - accounts-service
          - notifications-service
          - api-gateway
    env:
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      # build-push-action sube por defecto un artifact .dockerbuild por imagen; el resumen del job ya alcanza
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hadolint con versión y checksum fijos, como gitleaks y buf
      - name: hadolint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --config .hadolint.yaml "${{ matrix.service }}/Dockerfile"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Las capas quedan en la caché de Actions, una por servicio. Como la de Gradle, solo la escribe main y los PR la
      # leen. La caché de Gradle de dentro del Dockerfile (--mount=type=cache) no se guarda entre corridas (BANK-91 C8)
      - name: Construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          tags: bank-${{ matrix.service }}:local
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}

      - name: Usuario, HEALTHCHECK y credenciales
        run: infra/build-images.sh --check-only "${{ matrix.service }}"

      - name: Trivy
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          set -o pipefail
          TRIVY_BIN="$RUNNER_TEMP/trivy" infra/scan-images.sh "bank-${{ matrix.service }}:local" | tee -a "$GITHUB_STEP_SUMMARY"

  # Prueba de punta a punta (BANK-96): el sistema completo en contenedores, con el emulador de Cosmos (sin secretos,
  # también en PRs de forks), y Karate contra el gateway: login real, transferencias, el mainframe emulado y los
  # correos. Corre en paralelo con lo demás; las imágenes salen de la misma caché que el job images
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Deja a docker buildx leer la caché de Actions (la que escribe el job images en main)
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Construir las 6 imágenes
        run: |
          for service in config-server discovery-server customers-service accounts-service notifications-service api-gateway; do
            echo "::group::$service"
            docker buildx build --load -f "$service/Dockerfile" -t "bank-$service:local" \
              --cache-from "type=gha,scope=$service" .
            echo "::endgroup::"
          done

      - name: Prueba de punta a punta
        run: tests/e2e/run-ci.sh

      - name: Resumen
        if: always()
        run: |
          python3 -I - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          summary = pathlib.Path("tests/e2e/build/karate-reports/karate-summary-json.txt")
          if not summary.exists():
              print("### E2E\n\nKarate no llegó a correr: ver el paso anterior y los logs de los contenedores (artifact e2e-logs)")
              raise SystemExit
          data = json.loads(summary.read_text())
          print(f"### E2E: {data['scenariosPassed']} escenarios pasaron, {data['scenariosfailed']} fallaron "
                f"({data['elapsedTime'] / 1000:.1f} s)\n")
          for report in pathlib.Path("tests/e2e/build/karate-reports").glob("*.karate-json.txt"):
              for scenario in json.loads(report.read_text()).get("scenarioResults", []):
                  if scenario.get("failed"):
                      print(f"- ✗ **{scenario['name']}**: {str(scenario.get('error', ''))[:300]}")
          EOF

      - name: Logs de los contenedores
        if: failure()
        run: |
          mkdir -p e2e-logs
          for container in $(docker ps -a --format '{{.Names}}' | grep '^bank-'); do
            docker logs "$container" > "e2e-logs/$container.log" 2>&1 || true
          done
          cp -r tests/e2e/build/karate-reports e2e-logs/ 2>/dev/null || true

      - name: Guardar los logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7

  ci-ok:
    name: ci-ok
    needs: [test, sonar, gitleaks, buf, images, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pruebas y Quality Gate
        env:
          TESTS: ${{ needs.test.result }}
          SONAR: ${{ needs.sonar.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          BUF: ${{ needs.buf.result }}
          IMAGES: ${{ needs.images.result }}
          E2E: ${{ needs.e2e.result }}
          SONAR_CANNOT_RUN: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          echo "Pruebas: $TESTS · Sonar: $SONAR · Sonar no puede correr aquí: $SONAR_CANNOT_RUN · gitleaks: $GITLEAKS · buf: $BUF · imágenes: $IMAGES · e2e: $E2E"
          test "$TESTS" = "success"
          test "$GITLEAKS" = "success"
          test "$BUF" = "success"
          test "$IMAGES" = "success"
          test "$E2E" = "success"
          test "$SONAR" = "success" || { test "$SONAR" = "skipped" && test "$SONAR_CANNOT_RUN" = "true"; }
