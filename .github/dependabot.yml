# Dependabot (BANK-85): avisa con un PR cuando sale una versión nueva de una dependencia o de una action. Las
# vulnerables se descubrían a mano (Jackson, BANK-30). Cada PR pasa por la CI como cualquier otro (sin Sonar: Dependabot
# no recibe el secret, ci-ok lo acepta)
version: 2
updates:
  # Cada módulo es un proyecto Gradle aparte; las versiones comunes viven en platform-bom
  - package-ecosystem: gradle
    directories:
      - /platform-bom
      - /contracts
      - /customers-service
      - /accounts-service
      - /notifications-service
      - /api-gateway
      - /config-server
      - /discovery-server
      - /tests/perf
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 5
    # Dos PRs por semana como máximo: uno con los parches y otro con las versiones menores (de todas las carpetas).
    # Separar las menores una por una dio 20 PRs (cada dependencia en cada uno de los 9 proyectos): las peligrosas ya
    # no entran (ver ignore), así que agruparlas es seguro
    groups:
      gradle-parches:
        update-types: [patch]
      gradle-menores:
        update-types: [minor]
    # Subir Spring Boot, Spring Cloud o Spring gRPC de versión menor o mayor es una migración coordinada (van juntos):
    # se planifica como un ticket, no llega en un PR automático. Sus parches sí llegan. La primera corrida agrupó
    # Spring Boot 4.0 → 4.1 con todo lo demás y el PR no compilaba (spring-grpc 1.1 cambió sus starters)
    ignore:
      - dependency-name: 'org.springframework.boot*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'org.springframework.cloud:spring-cloud-dependencies'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'org.springframework.grpc:*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    commit-message:
      prefix: deps

  # Las actions de los workflows: están fijadas por commit, Dependabot actualiza el commit y el comentario de la versión
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: deps

  # Las imágenes base de los Dockerfiles (BANK-97): el JDK y el JRE de los 6 servicios (fijados por tag + digest) y
  # WireMock en el mainframe emulado. Todas en UN PR por semana: un parche de Ubuntu o del JRE cambia el digest de las
  # mismas dos imágenes en los 6 Dockerfiles. La versión mayor de Java (21 → 25) no llega sola: es una migración
  - package-ecosystem: docker
    directories:
      - /config-server
      - /discovery-server
      - /customers-service
      - /accounts-service
      - /notifications-service
      - /api-gateway
      - /infra/core-banking-mock
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 2
    groups:
      imagenes:
        patterns: ['*']
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
