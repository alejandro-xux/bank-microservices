# Dependabot (BANK-85): avisa con un PR cuando sale una versión nueva de una dependencia o de una action. Las
# vulnerables se descubrían a mano (Jackson, BANK-30). Cada PR pasa por la CI como cualquier otro (sin Sonar: Dependabot
# no recibe el secret, ci-ok lo acepta)
version: 2
updates:
  # Cada módulo es un proyecto Gradle aparte; las versiones comunes viven en platform-bom
  - package-ecosystem: gradle
    directories:
      - /platform-bom
      - /contracts
      - /customers-service
      - /accounts-service
      - /notifications-service
      - /api-gateway
      - /config-server
      - /discovery-server
      - /tests/perf
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 5
    # Los parches de todo, juntos en un solo PR por semana. Las versiones menores, cada una en su PR: la primera corrida
    # agrupó Spring Boot 4.0 → 4.1 con los parches y el PR no compilaba (spring-grpc 1.1 cambió sus starters)
    groups:
      gradle-parches:
        update-types: [patch]
    # Subir Spring Boot, Spring Cloud o Spring gRPC de versión menor o mayor es una migración coordinada (van juntos):
    # se planifica como un ticket, no llega en un PR automático. Sus parches sí llegan
    ignore:
      - dependency-name: 'org.springframework.boot*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'org.springframework.cloud:spring-cloud-dependencies'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'org.springframework.grpc:*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    commit-message:
      prefix: deps

  # Las actions de los workflows: están fijadas por commit, Dependabot actualiza el commit y el comentario de la versión
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: deps
