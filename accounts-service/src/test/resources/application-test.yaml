spring:
  # Las pruebas no usan el config-server: leen los mismos archivos de config-repo/ directamente.
  # La base la levanta Testcontainers (@ServiceConnection reemplaza url, usuario y contraseña)
  config:
    import:
      - file:../config-repo/application.yml
      - file:../config-repo/accounts-service.yml
  # El customers-service simulado corre en memoria; ningún servidor gRPC de prueba abre un puerto fijo
  grpc:
    server:
      port: 0

  # Cuenta las sentencias SQL que prepara Hibernate: la prueba del historial demuestra que no hay N+1
  # (solo en pruebas: en producción las estadísticas cuestan rendimiento)
  jpa:
    properties:
      hibernate:
        generate_statistics: true

# El resumen de estadísticas que Hibernate escribe al cerrar cada sesión: demasiado ruido en las pruebas
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn

# El relay del outbox no corre solo: las pruebas lo llaman a mano (OutboxRelay.publishBatch), sin carreras
bank:
  outbox:
    relay:
      enabled: false
    # Ni la limpieza (BANK-81): OutboxCleanup se llama a mano
    cleanup:
      enabled: false
  # Tampoco el recuperador de la SAGA (BANK-79): las pruebas llaman a TransferRecovery a mano
  saga:
    recovery:
      enabled: false

# Las pruebas no se registran en Eureka (no necesitan el discovery-server)
eureka:
  client:
    enabled: false
