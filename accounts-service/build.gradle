plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
}

// JaCoCo y lo que necesita Sonar, igual en todos los módulos (BANK-84)
apply from: '../gradle/quality.gradle'

group = 'com.alejandro.bank'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Versiones de platform-bom en cada configuración que declara dependencias sin versión
	def bom = platform('com.alejandro.bank:platform-bom')
	implementation bom
	compileOnly bom
	annotationProcessor bom
	testCompileOnly bom
	testAnnotationProcessor bom

	// Spring MVC (bloqueante) con hilos virtuales: JPA y JDBC son bloqueantes (spike BANK-51)
	// Clases generadas de contracts/customers.proto (BANK-60)
	implementation 'com.alejandro.bank:contracts'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// En Boot 4 Flyway necesita su starter y el módulo de PostgreSQL aparte
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// Cliente gRPC de customers-service con el contrato de contracts/ (BANK-62; antes OpenFeign)
	implementation 'org.springframework.grpc:spring-grpc-client-spring-boot-starter'
	// Publica TransferCompleted en Kafka con un Transactional Outbox (BANK-69)
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// Kafka real para el outbox (BANK-69): la misma imagen que infra/docker-compose.yml
	testImplementation 'org.testcontainers:testcontainers-kafka'
	// customers-service simulado como servidor gRPC en memoria (@AutoConfigureInProcessTransport)
	testImplementation 'org.springframework.grpc:spring-grpc-test'
	testImplementation 'org.springframework.grpc:spring-grpc-server-spring-boot-starter'
	// BDD (BANK-87): las reglas de una transferencia como escenarios en español (src/test/resources/features)
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-spring'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Las pruebas no usan el config-server: perfil "test" (lee config-repo/ directo) y cliente de config
	// apagado desde el arranque (en application-test.yaml llegaría tarde: el import se procesa antes)
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.cloud.config.enabled', 'false'
}
