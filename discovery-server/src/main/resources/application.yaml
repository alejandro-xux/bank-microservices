# Independiente del config-server: es infraestructura base y debe poder arrancar sola (BANK-44)
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: discovery-server

server:
  # Apagado ordenado, igual que los servicios que leen config-repo/application.yml (BANK-94)
  shutdown: graceful
  port: 8761

eureka:
  client:
    # Es el servidor: no se registra en sí mismo ni descarga el registro
    register-with-eureka: false
    fetch-registry: false
  server:
    # Solo local: si un servicio deja de latir se borra enseguida. En producción va encendido
    # (si muchos dejan de latir a la vez, asume una falla de red y no borra a nadie).
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness y /readiness, como los demás (BANK-94): las usan el HEALTHCHECK y AKS
      probes:
        enabled: true
