plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
}

group = 'com.alejandro.bank'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Versiones de platform-bom en cada configuración que declara dependencias sin versión
	def bom = platform('com.alejandro.bank:platform-bom')
	implementation bom
	compileOnly bom
	annotationProcessor bom
	testCompileOnly bom
	testAnnotationProcessor bom

	// Clases generadas de contracts/customers.proto (BANK-60)
	implementation 'com.alejandro.bank:contracts'
	// Servidor gRPC en :9091 para la comunicación interna (BANK-61), con su servicio health para las probes
	implementation 'org.springframework.grpc:spring-grpc-server-spring-boot-starter'
	implementation 'io.grpc:grpc-services'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'
	implementation 'com.azure.spring:spring-cloud-azure-starter-actuator'
	implementation 'com.azure.spring:spring-cloud-azure-starter-data-cosmos'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	// Servidor y canales gRPC en memoria para las pruebas (@AutoConfigureInProcessTransport)
	testImplementation 'org.springframework.grpc:spring-grpc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Las pruebas no usan el config-server: perfil "test" (lee config-repo/ directo) y cliente de config
	// apagado desde el arranque (en application-test.yaml llegaría tarde: el import se procesa antes)
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.cloud.config.enabled', 'false'
	// Servidor gRPC de las pruebas en un puerto libre: el 9091 puede estar ocupado por el servicio en local.
	// Va aquí y no en application-test.yaml porque config-repo/ (que ese archivo importa) le ganaría
	systemProperty 'spring.grpc.server.port', '0'
}
