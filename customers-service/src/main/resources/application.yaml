spring:
  application:
    # Con este nombre pide su configuración al config-server (config-repo/customers-service.yml)
    name: customers-service
  config:
    # "optional:" solo para que las pruebas (cliente de config apagado) ignoren este import;
    # con el cliente encendido, fail-fast hace que el servicio no arranque si el config-server no responde
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
    azure:
      cosmos:
        # Credenciales: solo por variables de entorno, nunca en config-repo/ (repositorio público)
        endpoint: ${COSMOS_ENDPOINT}
        key: ${COSMOS_KEY}
        database: bank
