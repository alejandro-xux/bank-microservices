spring:
  # Las pruebas no usan el config-server: leen los mismos archivos de config-repo/ directamente
  config:
    import:
      - file:../config-repo/application.yml
      - file:../config-repo/customers-service.yml
  cloud:
    azure:
      cosmos:
        enabled: false
  # El servidor gRPC de las pruebas no usa el 9091 (puede estar ocupado por el servicio en local);
  # las pruebas de gRPC van en memoria (@AutoConfigureInProcessTransport)
  grpc:
    server:
      port: 0

# Las pruebas no se registran en Eureka (no necesitan el discovery-server)
eureka:
  client:
    enabled: false
