spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: config-server
  profiles:
    # Backend native: lee archivos de una carpeta (decisión S5 del spike BANK-42)
    active: native
  cloud:
    config:
      server:
        native:
          # config-repo/ del repositorio; en Docker o en otra máquina se cambia con CONFIG_REPO
          search-locations: file:${CONFIG_REPO:../config-repo}

server:
  # Apagado ordenado, igual que los servicios que leen config-repo/application.yml (BANK-94)
  shutdown: graceful
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness y /readiness, como los demás (BANK-94): las usan el HEALTHCHECK y AKS
      probes:
        enabled: true
