name: bank-microservices

services:
  redis:
    image: redis:8.8.3-alpine
    container_name: bank-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Base relacional de accounts-service (BANK-52); en Azure, Azure Database for PostgreSQL Flexible Server.
  # El superusuario solo administra; cada servicio usa su propio usuario y base (postgres/init.sql).
  postgres:
    image: postgres:17.11-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "accounts", "-d", "accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedor de identidad solo para local: en Azure lo reemplaza Microsoft Entra (BANK-34).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: bank-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
