name: bank-microservices

# Los 6 servicios en contenedores (BANK-93) van en el perfil "app": sin él, `docker compose up` levanta solo la
# infraestructura, para correr los servicios con bootRun (infra/start-local.sh). Con él, el sistema completo como
# en producción (infra/start-local.sh --containers). Cada servicio recibe por variables los hosts de la red de Docker:
# son las mismas variables que ya lee config-repo/, así que la configuración no cambia
x-servicio: &servicio
  profiles: [app]
  restart: "no"
  # docker stop manda SIGTERM y, si el proceso no terminó, SIGKILL a los 10 s. El apagado ordenado tiene hasta 20 s
  # por fase (config-repo/application.yml, BANK-94): se le dan 30 s para que nunca lo corten a la mitad
  stop_grace_period: 30s
  environment: &entorno
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka
    # Se registran en Eureka con su IP: el nombre del contenedor no lo conocen los otros
    EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    # El emisor que dicen los tokens (KC_HOSTNAME de Keycloak) y las claves por la red interna: con issuer-uri solo,
    # el servicio buscaría la configuración en "localhost:8180", que dentro del contenedor es él mismo (BANK-91 C6)
    AUTH_ISSUER_URI: http://localhost:8180/realms/bank
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
    AUTH_TOKEN_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/token
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DB_HOST: postgres
    DB_PORT: "5432"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CUSTOMERS_GRPC_ADDRESS: static://customers-service:9091
    CORE_BANKING_URL: http://core-banking-mock:8080
    MAIL_HOST: mailpit
    # Secreto del cliente notifications-service del Keycloak LOCAL (infra/keycloak/bank-realm.json): no es un
    # secreto real; en Azure llega desde Key Vault
    NOTIFICATIONS_CLIENT_SECRET: notifications-local

services:
  redis:
    image: redis:8.8.3-alpine
    container_name: bank-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Base relacional de accounts-service (BANK-52); en Azure, Azure Database for PostgreSQL Flexible Server.
  # El superusuario solo administra; cada servicio usa su propio usuario y base (postgres/init.sql).
  postgres:
    image: postgres:17.11-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "accounts", "-d", "accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedor de identidad solo para local: en Azure lo reemplaza Microsoft Entra (BANK-34).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: bank-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # El emisor (iss) de todo token es siempre http://localhost:8180, se pida desde la Mac o desde la red de Docker
      # (keycloak:8080). Sin esto, el token de servicio de notifications pedido por la red interna dice
      # iss=http://keycloak:8080, customers lo rechaza y no salen los correos (BANK-91 C6)
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Bus de eventos (BANK-67, spike BANK-66 K1). Un nodo que es broker y controlador a la vez (KRaft, sin
  # ZooKeeper). En Azure: Event Hubs Standard o superior (NAMESPACE.servicebus.windows.net:9093, SASL_SSL
  # con OAUTHBEARER de Entra) o Confluent Cloud; el código no cambia, solo la configuración.
  # Dos listeners: Kafka le dice al cliente a qué dirección volver, y "localhost" dentro de un contenedor
  # es el propio contenedor. INTERNAL (kafka:9092) es para la red de Docker; HOST (localhost:9094), para
  # los servicios que corren con bootRun en la máquina. Sin volumen: --all empieza de cero, igual que PostgreSQL
  kafka:
    image: apache/kafka:4.3.1
    container_name: bank-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un solo nodo: los topics internos no pueden tener más réplicas que brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Como en Event Hubs: un nombre de topic mal escrito falla en vez de crear un topic nuevo
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea los topics una vez que Kafka está sano y termina (exit 0). En Azure lo hace Terraform/Bicep
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: bank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro
    restart: "no"

  # Bandeja de correo local (BANK-67): recibe por SMTP en :1025 y muestra los correos en http://localhost:8025.
  # Guarda en memoria: se vacía al reiniciar. En Azure, un proveedor real (Azure Communication Services Email)
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: bank-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mainframe emulado (BANK-76, spike BANK-74): recibe asientos contables en tramas de largo fijo y responde igual.
  # Recuerda cada asiento por id-op (BANK-90, extensión de estado de WireMock) y aplica reglas por los céntimos del
  # monto (infra/core-banking-mock/README.md). En un banco real el core se alcanza por IBM MQ o z/OS Connect frente a
  # programas CICS con copybooks COBOL de largo fijo
  core-banking-mock:
    build: ./core-banking-mock
    image: bank-core-banking-mock:local
    container_name: bank-core-banking-mock
    ports:
      - "8089:8080"
    volumes:
      - ./core-banking-mock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Los servicios (perfil app, BANK-93) --------------------------------------------------------------
  # Imágenes de BANK-92 (contexto = raíz del repo). Cada una trae su HEALTHCHECK, que es lo que esperan los
  # depends_on. Solo se publican a la Mac el gateway (la API) y Eureka (para mirar); el resto queda en la red interna
  config-server:
    <<: *servicio
    build: {context: .., dockerfile: config-server/Dockerfile}
    image: bank-config-server:local
    container_name: bank-config-server
    # Límite de memoria de cada servicio (BANK-94), con margen sobre lo medido en reposo y con carga (documento,
    # "La JVM en el contenedor"). El heap es el 60 % de este límite (JAVA_TOOL_OPTIONS en el Dockerfile)
    mem_limit: 384m
    environment:
      CONFIG_REPO: /config-repo
    volumes:
      - ../config-repo:/config-repo:ro

  discovery-server:
    <<: *servicio
    build: {context: .., dockerfile: discovery-server/Dockerfile}
    image: bank-discovery-server:local
    container_name: bank-discovery-server
    mem_limit: 512m
    ports:
      - "8761:8761"

  customers-service:
    <<: *servicio
    build: {context: .., dockerfile: customers-service/Dockerfile}
    image: bank-customers-service:local
    container_name: bank-customers-service
    mem_limit: 768m
    # COSMOS_ENDPOINT y COSMOS_KEY: solo desde el archivo fuera del repo (el mismo que usa start-local.sh)
    env_file:
      - path: ${BANK_ENV_FILE:-${HOME}/.bank-microservices.env}
        required: true
    depends_on: &base
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      redis: {condition: service_healthy}

  accounts-service:
    <<: *servicio
    build: {context: .., dockerfile: accounts-service/Dockerfile}
    image: bank-accounts-service:local
    container_name: bank-accounts-service
    mem_limit: 768m
    depends_on:
      <<: *base
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      core-banking-mock: {condition: service_healthy}
      customers-service: {condition: service_healthy}

  # La misma cuenta en Quarkus (E14, BANK-99): la misma base y el mismo contrato que accounts-service, que es quien
  # migra el esquema (este solo lo valida, por eso espera a que accounts-service esté sano). Todavía sin tráfico: el
  # gateway lo recibe con pesos en BANK-104
  accounts-service-quarkus:
    <<: *servicio
    build: {context: .., dockerfile: accounts-service-quarkus/Dockerfile}
    image: bank-accounts-service-quarkus:local
    container_name: bank-accounts-service-quarkus
    mem_limit: 768m
    environment:
      <<: *entorno
      # Las claves de Keycloak por la red interna (el emisor de los tokens sigue siendo localhost:8180)
      AUTH_JWKS_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      CUSTOMERS_GRPC_HOST: customers-service
    depends_on:
      <<: *base
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      core-banking-mock: {condition: service_healthy}
      customers-service: {condition: service_healthy}
      accounts-service: {condition: service_healthy}

  notifications-service:
    <<: *servicio
    build: {context: .., dockerfile: notifications-service/Dockerfile}
    image: bank-notifications-service:local
    container_name: bank-notifications-service
    mem_limit: 512m
    depends_on:
      <<: *base
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
      customers-service: {condition: service_healthy}

  api-gateway:
    <<: *servicio
    build: {context: .., dockerfile: api-gateway/Dockerfile}
    image: bank-api-gateway:local
    container_name: bank-api-gateway
    mem_limit: 512m
    environment:
      <<: *entorno
      # A qué versión de accounts van /api/accounts y /api/transfers (BANK-103). Por defecto la de Spring, por Eureka;
      # la E2E de la variante Quarkus pasa ACCOUNTS_SERVICE_URI=http://accounts-service-quarkus:8084 (tests/e2e/run-ci.sh)
      ACCOUNTS_SERVICE_URI: ${ACCOUNTS_SERVICE_URI:-lb://accounts-service}
    ports:
      - "8080:8080"
    depends_on:
      <<: *base
      customers-service: {condition: service_healthy}
      accounts-service: {condition: service_healthy}
