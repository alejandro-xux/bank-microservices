name: bank-microservices

services:
  redis:
    image: redis:8.8.3-alpine
    container_name: bank-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Base relacional de accounts-service (BANK-52); en Azure, Azure Database for PostgreSQL Flexible Server.
  # El superusuario solo administra; cada servicio usa su propio usuario y base (postgres/init.sql).
  postgres:
    image: postgres:17.11-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "accounts", "-d", "accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedor de identidad solo para local: en Azure lo reemplaza Microsoft Entra (BANK-34).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: bank-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Bus de eventos (BANK-67, spike BANK-66 K1). Un nodo que es broker y controlador a la vez (KRaft, sin
  # ZooKeeper). En Azure: Event Hubs Standard o superior (NAMESPACE.servicebus.windows.net:9093, SASL_SSL
  # con OAUTHBEARER de Entra) o Confluent Cloud; el código no cambia, solo la configuración.
  # Dos listeners: Kafka le dice al cliente a qué dirección volver, y "localhost" dentro de un contenedor
  # es el propio contenedor. INTERNAL (kafka:9092) es para la red de Docker; HOST (localhost:9094), para
  # los servicios que corren con bootRun en la máquina. Sin volumen: --all empieza de cero, igual que PostgreSQL
  kafka:
    image: apache/kafka:4.3.1
    container_name: bank-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un solo nodo: los topics internos no pueden tener más réplicas que brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Como en Event Hubs: un nombre de topic mal escrito falla en vez de crear un topic nuevo
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea los topics una vez que Kafka está sano y termina (exit 0). En Azure lo hace Terraform/Bicep
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: bank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro
    restart: "no"

  # Bandeja de correo local (BANK-67): recibe por SMTP en :1025 y muestra los correos en http://localhost:8025.
  # Guarda en memoria: se vacía al reiniciar. En Azure, un proveedor real (Azure Communication Services Email)
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: bank-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mainframe emulado (BANK-76, spike BANK-74): recibe asientos contables en tramas de largo fijo y responde igual.
  # Sin estado: responde según reglas por los céntimos del monto (infra/core-banking-mock/README.md). En un banco real
  # el core se alcanza por IBM MQ o z/OS Connect frente a programas CICS con copybooks COBOL de largo fijo
  core-banking-mock:
    image: wiremock/wiremock:3.13.2
    container_name: bank-core-banking-mock
    command: ["--global-response-templating", "--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./core-banking-mock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
