// Versiones de todo el sistema en un solo lugar (como el BOM corporativo de un banco).
// Cada servicio lo importa con includeBuild('../platform-bom') y platform('com.alejandro.bank:platform-bom').
plugins {
	id 'java-platform'
}

group = 'com.alejandro.bank'

repositories {
	mavenCentral()
}

// Permite importar otros BOM dentro de este
javaPlatform {
	allowDependencies()
}

dependencies {
	api platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
	// 2025.1.3 está construida sobre Boot 4.0.8; la 2025.1.4 sube Boot a 4.0.9 (spike BANK-42)
	api platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
	// Spring Cloud Azure 7.3.0 solo admite Boot < 4.1
	api platform('com.azure.spring:spring-cloud-azure-dependencies:7.3.0')
	// Parches de seguridad de Jackson (GHSA-7hhh-6rmp-j9qf y otros); quitar al subir a un Boot que ya los traiga
	api platform('tools.jackson:jackson-bom:3.1.8')
	api platform('com.fasterxml.jackson:jackson-bom:2.21.8')
	// gRPC interno (E6): Spring gRPC 1.0.x es la línea para Boot 4.0 (la 1.1 vive en Boot 4.1);
	// trae grpc-bom 1.77.1 y protobuf-bom 4.33.4 (spike BANK-59)
	api platform('org.springframework.grpc:spring-grpc-dependencies:1.0.3')
	// BDD (BANK-87): escenarios en español que corren con JUnit Platform, en la misma tarea test
	api platform('io.cucumber:cucumber-bom:8.0.4')

	constraints {
		api 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.3'
		api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

		// Parches de seguridad que encontró Trivy en las imágenes (BANK-95, spike BANK-91 C3): CRITICAL y HIGH con
		// arreglo. Quitar cada uno cuando el BOM que lo trae ya lo incluya (Tomcat: Spring Boot 4.0.9, PR #64)
		api 'org.apache.tomcat.embed:tomcat-embed-core:11.0.27'
		api 'org.apache.tomcat.embed:tomcat-embed-el:11.0.27'
		api 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.27'
		// Panel web de Eureka (discovery-server)
		api 'org.freemarker:freemarker:2.3.35'
		// Compresión del cliente de Kafka (accounts, notifications)
		api 'at.yawk.lz4:lz4-java:1.11.4'
		// Cliente HTTP de Spring Cloud (Eureka, config) y de Azure
		api 'org.apache.httpcomponents.core5:httpcore5:5.4.4'
		api 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.4'
	}
}
