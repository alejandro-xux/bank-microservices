# fraud-service (BANK-107). Aquí va lo que Quarkus fija al compilar o lo que no cambia por entorno; los valores de cada
# entorno (base, Kafka, emisor de tokens) llegan del config-server: config-repo/fraud-service.yml
quarkus.application.name=fraud-service
quarkus.http.port=8085

quarkus.spring-cloud-config.enabled=true
quarkus.spring-cloud-config.url=${CONFIG_SERVER_URL:http://localhost:8888}
quarkus.spring-cloud-config.fail-fast=true

# Su propia base (fraud) y su propio esquema: este servicio sí aplica sus migraciones al arrancar
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# Las transferencias completadas (spike BANK-105, F1): un grupo propio, así no le quita eventos a notifications.
# Desde el principio del topic la primera vez: una transferencia de antes de que existiera el servicio igual se revisa.
# El evento llega en bytes (Protobuf) y el tipo en el header event-type, como lo publica el outbox (BANK-69)
mp.messaging.incoming.transfers.connector=smallrye-kafka
mp.messaging.incoming.transfers.topic=bank.transfers.v1
mp.messaging.incoming.transfers.group.id=fraud-service
mp.messaging.incoming.transfers.auto.offset.reset=earliest
mp.messaging.incoming.transfers.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transfers.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
# Un mensaje que no se puede procesar no detiene al consumidor: va a su DLT (topic creado por kafka-init)
mp.messaging.incoming.transfers.failure-strategy=dead-letter-queue
mp.messaging.incoming.transfers.dead-letter-queue.topic=bank.fraud.v1.DLT
mp.messaging.incoming.transfers.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Los avisos de transferencias sospechosas (BANK-108): FraudSuspected en Protobuf, clave = cuenta origen (FraudAlerts)
mp.messaging.outgoing.fraud-alerts.connector=smallrye-kafka
mp.messaging.outgoing.fraud-alerts.topic=bank.fraud.v1
mp.messaging.outgoing.fraud-alerts.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fraud-alerts.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Umbrales de las reglas de fraude (BANK-108, FraudPolicy). Valores por defecto pensados para cuentas personales; cada
# entorno los cambia en config-repo/fraud-service.yml. Las transferencias de la E2E (de 1 a 10 soles, al mismo destino,
# 2 por corrida) no disparan ninguna
# Monto alto, siempre: desde 10 000 soles o 3 000 dólares
fraud.rules.high-amount.PEN=10000.00
fraud.rules.high-amount.USD=3000.00
# Monto alto por promedio: más de 5 veces el promedio de la cuenta (con al menos 3 transferencias antes), y solo desde
# 1 000 soles o 300 dólares
fraud.rules.average-floor.PEN=1000.00
fraud.rules.average-floor.USD=300.00
fraud.rules.average-multiplier=5
fraud.rules.average-min-history=3
# Frecuencia: más de 5 transferencias desde la misma cuenta en 10 minutos
fraud.rules.velocity-max=5
fraud.rules.velocity-window=10M
# Destino nuevo con monto alto: desde 2 000 soles o 600 dólares a un destino al que la cuenta nunca transfirió
fraud.rules.new-destination-amount.PEN=2000.00
fraud.rules.new-destination-amount.USD=600.00

# Resource server, como accounts: roles desde el claim "roles". Solo el health es público
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=roles
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.health.paths=/actuator/health,/actuator/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.rest.paths=/*
quarkus.http.auth.permission.rest.policy=authenticated

# Liveness y readiness en las mismas rutas que los demás servicios (las usan el HEALTHCHECK y los scripts)
quarkus.smallrye-health.root-path=/actuator/health
quarkus.smallrye-health.liveness-path=liveness
quarkus.smallrye-health.readiness-path=readiness

quarkus.devservices.enabled=false

# Pruebas: el config-server apagado, PostgreSQL, Kafka y la llave de los tokens los pone FraudTestResource (también
# para el binario de @QuarkusIntegrationTest, que corre con el perfil prod y no lee las propiedades %test)
%test.quarkus.jacoco.report-location=build/reports/jacoco/test
%test.quarkus.jacoco.reuse-data-file=true
