// accounts-service en Quarkus (E14, BANK-99): la misma API, los mismos eventos y la misma base que accounts-service
// (Spring), que no se toca. Conviven mientras el gateway pasa el tráfico de una a otra (estrategia strangler)
plugins {
    id 'java'
    id 'io.quarkus' version '3.40.1'
}

group = 'com.alejandro.bank'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Solo la tarea de las rutas para Sonar: la cobertura la mide quarkus-jacoco (el plugin jacoco de Gradle no coincide
// con las clases que Quarkus transforma al arrancar)
apply from: '../gradle/sonar-libraries.gradle'

dependencies {
    // Quarkus 3.40.1 (LTS, spike BANK-98). Enforced: sus versiones mandan sobre cualquier otra que llegue por contracts
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.40.1')
    // contracts trae platform-bom (las versiones de Spring) como api; aquí no sirven y subirían Netty a 4.2
    implementation('com.alejandro.bank:contracts') {
        exclude group: 'com.alejandro.bank', module: 'platform-bom'
    }
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-grpc'
    // El mainframe por HTTP (tramas de texto) y el recuperador de la SAGA cada 5 s
    implementation 'io.quarkus:quarkus-rest-client'
    implementation 'io.quarkus:quarkus-scheduler'
    // El relay del outbox con el cliente de Kafka directo (D5), como el productor de accounts-service
    implementation 'io.quarkus:quarkus-kafka-client'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-spring-cloud-config-client'

    testImplementation 'io.quarkus:quarkus-junit5'
    // Tokens firmados de verdad en las pruebas: pasan por la misma validación OIDC y por el reenvío a customers
    testImplementation 'io.quarkus:quarkus-smallrye-jwt-build'
    testImplementation 'io.quarkus:quarkus-jacoco'
    testImplementation 'io.rest-assured:rest-assured'
    // Misma versión que accounts-service (la BOM de Quarkus no la fija)
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // El esquema en las pruebas: los mismos scripts de accounts-service. En producción solo Spring migra (D3)
    testImplementation 'io.quarkus:quarkus-flyway'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
}

// Parches de seguridad que la BOM de Quarkus todavía no trae (Trivy, D7 de BANK-95): la misma versión que
// platform-bom fija para los servicios Spring. enforcedPlatform gana a una restricción común; esto gana a los dos.
// Se quita cuando la BOM de Quarkus traiga una versión igual o mayor
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // HIGH CVE-2026-106451 en 1.11.1 (la compresión del cliente de Kafka)
        if (details.requested.group == 'at.yawk.lz4' && details.requested.name == 'lz4-java') {
            details.useVersion '1.11.4'
            details.because 'CVE-2026-106451: la BOM de Quarkus 3.40.1 trae 1.11.1'
        }
    }
}

tasks.named('test') {
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}
