# accounts-service-quarkus (BANK-99). Aquí va solo lo que Quarkus fija al compilar o lo que no cambia por entorno;
# los valores de cada entorno (base, emisor de tokens, customers) llegan del config-server:
# config-repo/accounts-service-quarkus.yml, con las mismas variables que accounts-service (D4)
quarkus.application.name=accounts-service-quarkus
quarkus.http.port=8084

quarkus.spring-cloud-config.enabled=true
quarkus.spring-cloud-config.url=${CONFIG_SERVER_URL:http://localhost:8888}
# Como accounts-service: si el config-server no responde, no arranca con una configuración a medias
quarkus.spring-cloud-config.fail-fast=true

# La misma base que accounts-service. Solo Spring aplica las migraciones; aquí Hibernate valida que las entidades
# coincidan con las tablas, y si no coinciden el servicio no arranca (D3)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate

# Resource server: roles desde el claim "roles" (como authorities-claim-name en Spring). Sin autenticación proactiva,
# para que el 401/403 llegue a SecurityProblems y salga como ProblemDetail
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=roles
quarkus.http.auth.proactive=false

# Liveness y readiness en las mismas rutas que los servicios Spring (las usan el HEALTHCHECK y los scripts)
quarkus.smallrye-health.root-path=/actuator/health
quarkus.smallrye-health.liveness-path=liveness
quarkus.smallrye-health.readiness-path=readiness

# OpenAPI (BANK-111), en la misma ruta y con el mismo esquema de seguridad que springdoc en accounts-service: el botón
# "Authorize" descubre el login en el emisor. 401/403 y ProblemDetail los agrega ProblemsOpenApiFilter
quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.smallrye-openapi.info-title=accounts-service-quarkus
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=oidc
quarkus.smallrye-openapi.oidc-open-id-connect-url=${AUTH_ISSUER_URI:http://localhost:8180/realms/bank}/.well-known/openid-configuration
mp.openapi.filter=com.alejandro.bank.accounts.web.ProblemsOpenApiFilter

quarkus.devservices.enabled=false

# Pruebas: sin config-server ni Keycloak (los tokens los firma la prueba con su propia llave), y el esquema lo crea Flyway con los mismos
# scripts de accounts-service (src/test/resources/db/migration). La cobertura, en el lugar que lee Sonar
%test.quarkus.spring-cloud-config.enabled=false
# El binario de @QuarkusIntegrationTest (src/native-test, BANK-109) corre con este mismo perfil test: con prod buscaría
# el config-server y le faltaría toda la configuración bank.* de config-repo
quarkus.test.integration-test-profile=test
# Los procesos de fondo apagados en las pruebas: se llaman a mano (CONTRIBUTING)
%test.bank.saga.recovery.every=off
%test.bank.outbox.relay.every=off
%test.bank.outbox.cleanup.every=off
# Las pendientes cuentan enseguida y el tope de revisión es corto para poder probarlo (RecoveryTest). Van para toda la
# suite: con el proceso apagado solo las usa la prueba que llama al recuperador (un @TestProfile reiniciaría la app)
%test.bank.saga.recovery.min-age=0s
%test.bank.saga.recovery.review-after=2s
# Lotes de 10 para probar la limpieza por lotes con pocas filas (OutboxCleanupTest)
%test.bank.outbox.cleanup.batch-size=10
# Para contar las sentencias SQL del historial (sin N+1, como en accounts-service)
%test.quarkus.hibernate-orm.statistics=true
%test.quarkus.jacoco.report-location=build/reports/jacoco/test
# Suma lo que midió el agente de Gradle en las pruebas unitarias simples (BANK-106): un solo XML con todo
%test.quarkus.jacoco.reuse-data-file=true
