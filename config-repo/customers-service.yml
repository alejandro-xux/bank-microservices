# Configuración de customers-service, servida por el config-server (BANK-43).
# Las credenciales de Cosmos NO van aquí: siguen en variables de entorno (application.yaml del servicio).
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 200ms
  # gRPC interno (BANK-61): accounts-service consulta clientes por aquí con el contrato de contracts/.
  # El token se valida con las mismas propiedades de application.yml (iss, aud, roles).
  # Reflection (para explorar con grpcurl) solo si se activa en local; health siempre, para las probes
  grpc:
    server:
      port: ${GRPC_PORT:9091}
      reflection:
        enabled: ${GRPC_REFLECTION_ENABLED:false}

springdoc:
  swagger-ui:
    oauth:
      # Cliente público del navegador (bank-web en Keycloak): login con PKCE, sin secreto
      client-id: ${SWAGGER_CLIENT_ID:bank-web}
      use-pkce-with-authorization-code-grant: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
