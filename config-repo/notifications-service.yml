# Configuración de notifications-service, servida por el config-server (BANK-70).
# Los valores por defecto son del entorno local (no son secretos); en Azure llegan por variables.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notifications}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications-local}
  threads:
    virtual:
      enabled: true
  # Consumidor de bank.transfers.v1 (BANK-70). En local, el Kafka del compose por su puerta del host (BANK-67);
  # en Azure, Event Hubs (NAMESPACE.servicebus.windows.net:9093) con SASL_SSL, solo por configuración
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      # Un grupo propio: lleva su propio offset, independiente de cualquier otro consumidor del topic
      group-id: notifications-service
      # La primera vez que arranca el grupo lee desde el principio del topic: un evento publicado antes de
      # desplegar el servicio también se avisa (para eso es idempotente, BANK-72)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Un mensaje ilegible no tira al consumidor: llega al manejo de errores (BANK-73)
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.alejandro.bank.notifications.transfers.TransferCompletedDeserializer
        # Lo que recomienda Event Hubs para no caer en rebalanceos continuos (spike BANK-66, K12)
        request.timeout.ms: 60000
        session.timeout.ms: 30000
  # Correo (BANK-72). En local, Mailpit (BANK-67: SMTP en :1025, bandeja en http://localhost:8025); en Azure, un
  # proveedor real (Azure Communication Services Email) con usuario y contraseña por variable
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # Sin esto JavaMail espera PARA SIEMPRE a un servidor que no responde: el consumidor quedaría colgado
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  # customers-service por gRPC (BANK-71): dirección por configuración, como en accounts-service
  grpc:
    client:
      channels:
        customers:
          address: ${CUSTOMERS_GRPC_ADDRESS:static://localhost:9091}
  # Token propio del servicio (client credentials), con el rol NOTIFICATIONS: lo único que permite es GetContact.
  # En local, el cliente notifications-service del Keycloak (infra/keycloak/bank-realm.json). En Azure, un app
  # registration de Entra: AUTH_TOKEN_URI = https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token y
  # AUTH_CLIENT_SCOPE = api://bank-api/.default (o una identidad administrada, sin secreto)
  security:
    oauth2:
      client:
        registration:
          bank-api:
            provider: bank-identity
            client-id: ${NOTIFICATIONS_CLIENT_ID:notifications-service}
            # Sin valor por defecto: el secreto nunca va en config-repo (start-local.sh pone el local)
            client-secret: ${NOTIFICATIONS_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: ${AUTH_CLIENT_SCOPE:}
        provider:
          bank-identity:
            token-uri: ${AUTH_TOKEN_URI:http://localhost:8180/realms/bank/protocol/openid-connect/token}

bank:
  # Plazo máximo de cada llamada a customers-service
  customers:
    deadline: ${CUSTOMERS_DEADLINE:2s}
  notifications:
    mail:
      from: ${MAIL_FROM:avisos@bank.local}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        # La readiness incluye la base; Kafka no: si Kafka todavía no arrancó, el consumidor reintenta solo
        # y el servicio sigue sano (los mensajes esperan en el topic)
        readiness:
          include: readinessState,db
