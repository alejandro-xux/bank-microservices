# Configuración común a todos los servicios, servida por el config-server (BANK-43).
# Repositorio público: aquí NUNCA van secretos; esos llegan por variables de entorno.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor de confianza (iss) y audiencia (aud). Por defecto, el Keycloak local;
          # en Azure se definen con las variables apuntando a Microsoft Entra, sin cambiar código.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8180/realms/bank}
          # bank-api = toda la API detrás del gateway (un token sirve para todos los servicios);
          # el gateway y cada servicio la validan (zero trust). En Entra: el registro de app de la API (BANK-50)
          audiences: ${AUTH_AUDIENCE:bank-api}
          # Roles del claim "roles" (CUSTOMER → ROLE_CUSTOMER), igual en Keycloak y en Entra (app roles)
          authorities-claim-name: roles
          authority-prefix: ROLE_
  # Apagado ordenado (BANK-94): al recibir SIGTERM (docker stop, o AKS al mover un pod) el servicio deja de aceptar
  # peticiones nuevas, termina las que están en curso y recién entonces se detienen el relay del outbox, el
  # recuperador y los consumidores de Kafka. Cada fase tiene hasta 20 s; compose espera 30 s antes de matarlo
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

# Todos los servicios se registran en Eureka con su spring.application.name (BANK-44).
# En AKS (E12) Eureka se reemplaza por Services y DNS de Kubernetes.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
