# accounts-service-quarkus (E14, BANK-99): los mismos valores y variables que accounts-service.yml, con los nombres de
# propiedad de Quarkus. Lo que se fija al compilar está en su application.properties
quarkus:
  datasource:
    username: ${DB_USERNAME:accounts}
    password: ${DB_PASSWORD:accounts-local}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:accounts}
  oidc:
    # El emisor que dicen los tokens y las claves por separado, sin el descubrimiento de Keycloak: dentro de Docker
    # devolvería direcciones con localhost:8180 (spike BANK-98, la misma idea que KC_HOSTNAME en BANK-93)
    auth-server-url: ${AUTH_ISSUER_URI:http://localhost:8180/realms/bank}
    discovery-enabled: false
    jwks-path: ${AUTH_JWKS_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
    token:
      issuer: ${AUTH_ISSUER_URI:http://localhost:8180/realms/bank}
      audience: ${AUTH_AUDIENCE:bank-api}
  grpc:
    clients:
      customers:
        host: ${CUSTOMERS_GRPC_HOST:localhost}
        port: ${CUSTOMERS_GRPC_PORT:9091}
bank:
  customers:
    # Plazo de cada llamada a customers-service (como en accounts-service): pasado, 503
    deadline: ${CUSTOMERS_DEADLINE:2s}
  # El mainframe emulado y el recuperador de la SAGA, con las mismas variables y valores que accounts-service
  core-banking:
    url: ${CORE_BANKING_URL:http://localhost:8089}
    timeout: ${CORE_BANKING_TIMEOUT:2s}
  saga:
    recovery:
      every: 5s
      min-age: 10s
      review-after: 30m
      batch-size: 50
  # Relay del outbox (BANK-102), con los mismos valores que accounts-service: cada 500 ms, lotes de 100; limpieza
  # cada hora de lo publicado hace más de 7 días, de a 1000. Los timeouts del productor están en OutboxKafka
  outbox:
    batch-size: 100
    relay:
      every: 0.5s
    cleanup:
      every: 1h
      retention: 7d
      batch-size: 1000
  # Kafka del compose por su puerta del host en bootRun; en contenedores llega KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
