# Configuración de accounts-service, servida por el config-server (BANK-52).
# Los valores por defecto son del entorno local (no son secretos); en Azure llegan por variables.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:accounts}
    username: ${DB_USERNAME:accounts}
    password: ${DB_PASSWORD:accounts-local}
  jpa:
    hibernate:
      # Las tablas las crea y cambia solo Flyway; Hibernate revisa al arrancar que las entidades
      # coincidan con ellas y, si no, el servicio no arranca
      ddl-auto: validate
    # Sin consultas a la base fuera de la transacción del servicio (por ejemplo, al armar el JSON)
    open-in-view: false
  # Cada petición en un hilo virtual: mientras espera a la base no ocupa un hilo del sistema (spike BANK-51)
  threads:
    virtual:
      enabled: true
  # customers-service por gRPC (BANK-62): dirección por configuración, sin Eureka (en AKS será el DNS
  # del Service, customers-service:9091). Si no responde a tiempo, la operación termina en 503
  grpc:
    client:
      channels:
        customers:
          address: ${CUSTOMERS_GRPC_ADDRESS:static://localhost:9091}
  # Productor del outbox (BANK-69). En local, el Kafka del compose por su puerta del host (BANK-67); en Azure,
  # Event Hubs (NAMESPACE.servicebus.windows.net:9093) con SASL_SSL, solo por configuración
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El payload ya viene en Protobuf desde el outbox: viaja tal cual
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # El relay marca un evento como publicado solo cuando Kafka confirmó que lo guardó
      acks: all
      properties:
        # Con Kafka caído, los valores por defecto dejan al relay hasta 60 s con una conexión de PostgreSQL
        # tomada; así falla a los 5-10 s y reintenta en la siguiente vuelta (spike BANK-66, K6)
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Plazo máximo de cada llamada a customers-service (equivale al read-timeout que tenía Feign)
bank:
  customers:
    deadline: ${CUSTOMERS_DEADLINE:2s}
  # Core bancario (mainframe emulado, BANK-76/77). En local, el WireMock del compose; en un banco real, IBM MQ o
  # z/OS Connect frente al core. Pasado el plazo, el resultado es "desconocido", nunca un rechazo
  core-banking:
    url: ${CORE_BANKING_URL:http://localhost:8089}
    timeout: ${CORE_BANKING_TIMEOUT:2s}
  # Relay del outbox (BANK-69): cada 500 ms, lotes de 100
  outbox:
    poll-interval-ms: 500
    batch-size: 100

springdoc:
  swagger-ui:
    oauth:
      # Cliente público del navegador (bank-web en Keycloak): login con PKCE, sin secreto
      client-id: ${SWAGGER_CLIENT_ID:bank-web}
      use-pkce-with-authorization-code-grant: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        # La readiness incluye la base: sin PostgreSQL, AKS deja de enviarle tráfico (pero no lo reinicia)
        readiness:
          include: readinessState,db
