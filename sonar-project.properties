# Análisis de SonarCloud (BANK-84, spike BANK-82 Q5). UN proyecto para el repo entero: la CI prueba cada módulo en su
# job y un job final analiza todo junto, así hay un solo Quality Gate y Sonar ve el código duplicado entre servicios.
# Las rutas de los jars (sonar.java.libraries y sonar.java.test.libraries) las agrega el workflow al final de este
# archivo, en su copia: dependen de la máquina
sonar.organization=alejandro-xux
sonar.projectKey=alejandro-xux_bank-microservices
sonar.projectName=bank-microservices

sonar.sourceEncoding=UTF-8
sonar.java.source=21

# Un módulo por servicio (BANK-101): cada XML de JaCoCo se aplica SOLO a los archivos de su módulo. Con todos los
# reportes para el proyecto entero, Sonar ubica cada archivo del XML por paquete y nombre, y accounts-service-quarkus
# repite a propósito los de accounts-service (mismo paquete, estrategia strangler): de cada par, uno se quedaba con la
# cobertura de los dos reportes y el otro en 0 % (en main, Account, AccountService y DepositService de Spring).
# Las claves de los archivos no cambian (ruta desde la raíz del repo). Las rutas de cada módulo son relativas a su
# carpeta; lo que está fuera de un módulo (sonar.java.source, las librerías que agrega la CI) lo heredan todos.
# Clases compiladas y XML de JaCoCo: lo que dejó cada job de la matriz (artifact sonar-<módulo>), una ruta por módulo:
# el motor de seguridad no expande "*" ("Class file not found" en 123 archivos, análisis en DEBUG de BANK-97)
sonar.modules=contracts,customers-service,accounts-service,accounts-service-quarkus,notifications-service,api-gateway,config-server,discovery-server

contracts.sonar.sources=src/main
contracts.sonar.tests=src/test
contracts.sonar.java.binaries=../sonar-inputs/sonar-contracts/classes/java/main
contracts.sonar.java.test.binaries=../sonar-inputs/sonar-contracts/classes/java/test
contracts.sonar.coverage.jacoco.xmlReportPaths=../sonar-inputs/sonar-contracts/reports/jacoco/test/jacocoTestReport.xml

