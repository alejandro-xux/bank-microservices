# accounts-service-quarkus es la migración de accounts-service y copia a propósito parte de su código mientras las dos
# versiones conviven (estrategia strangler, D2 del Sprint 12): sin esto, el Quality Gate lo frenaría por duplicación.
# Se quita cuando una de las dos versiones se retire. En el módulo: sus patrones son relativos a su carpeta
accounts-service-quarkus.sonar.cpd.exclusions=**/*

# El arranque de cada servicio (solo levanta Spring) no cuenta para la cobertura
sonar.coverage.exclusions=**/*Application.java

# El job espera el veredicto del Quality Gate y falla si no pasa: así lo exige ci-ok
sonar.qualitygate.wait=true

