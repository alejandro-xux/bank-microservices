# Análisis de SonarCloud (BANK-84, spike BANK-82 Q5). UN proyecto para el repo entero: la CI prueba cada módulo en su
# job y un job final analiza todo junto, así hay un solo Quality Gate y Sonar ve el código duplicado entre servicios.
# Las rutas de los jars (sonar.java.libraries y sonar.java.test.libraries) las agrega el workflow al final de este
# archivo, en su copia: dependen de la máquina
sonar.organization=alejandro-xux
sonar.projectKey=alejandro-xux_bank-microservices
sonar.projectName=bank-microservices

sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.sources=\
  contracts/src/main,\
  customers-service/src/main,\
  accounts-service/src/main,\
  notifications-service/src/main,\
  api-gateway/src/main,\
  config-server/src/main,\
  discovery-server/src/main
sonar.tests=\
  contracts/src/test,\
  customers-service/src/test,\
  accounts-service/src/test,\
  notifications-service/src/test,\
  api-gateway/src/test,\
  config-server/src/test,\
  discovery-server/src/test

# Lo que dejó cada job de la matriz (artifact sonar-<módulo>): clases compiladas y el XML de JaCoCo. Una ruta por
# módulo y no "sonar-inputs/*": el analizador Java expande el *, pero el motor de seguridad no y no encontraba ninguna
# clase compilada ("Class file not found" en 123 archivos, análisis en DEBUG de BANK-97)
sonar.java.binaries=\
  sonar-inputs/sonar-contracts/classes/java/main,\
  sonar-inputs/sonar-customers-service/classes/java/main,\
  sonar-inputs/sonar-accounts-service/classes/java/main,\
  sonar-inputs/sonar-notifications-service/classes/java/main,\
  sonar-inputs/sonar-api-gateway/classes/java/main,\
  sonar-inputs/sonar-config-server/classes/java/main,\
  sonar-inputs/sonar-discovery-server/classes/java/main
sonar.java.test.binaries=\
  sonar-inputs/sonar-contracts/classes/java/test,\
  sonar-inputs/sonar-customers-service/classes/java/test,\
  sonar-inputs/sonar-accounts-service/classes/java/test,\
  sonar-inputs/sonar-notifications-service/classes/java/test,\
  sonar-inputs/sonar-api-gateway/classes/java/test,\
  sonar-inputs/sonar-config-server/classes/java/test,\
  sonar-inputs/sonar-discovery-server/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=\
  sonar-inputs/sonar-contracts/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-customers-service/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-accounts-service/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-notifications-service/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-api-gateway/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-config-server/reports/jacoco/test/jacocoTestReport.xml,\
  sonar-inputs/sonar-discovery-server/reports/jacoco/test/jacocoTestReport.xml

# El arranque de cada servicio (solo levanta Spring) no cuenta para la cobertura
sonar.coverage.exclusions=**/*Application.java

# El job espera el veredicto del Quality Gate y falla si no pasa: así lo exige ci-ok
sonar.qualitygate.wait=true

# TEMPORAL BANK-97: análisis en DEBUG para ver los tipos sin resolver (se quita antes del merge)
sonar.verbose=true
