plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
}

// JaCoCo y lo que necesita Sonar, igual en todos los módulos (BANK-84)
apply from: '../gradle/quality.gradle'

group = 'com.alejandro.bank'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Versiones de platform-bom en cada configuración que declara dependencias sin versión
	def bom = platform('com.alejandro.bank:platform-bom')
	implementation bom
	compileOnly bom
	annotationProcessor bom
	testCompileOnly bom
	testAnnotationProcessor bom

	// Avisos al cliente a partir de eventos de Kafka (E7). Sin API pública: Spring MVC solo para actuator
	// Clases generadas de contracts/transfer_events.proto (BANK-68)
	implementation 'com.alejandro.bank:contracts'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Correo por SMTP (BANK-72): Mailpit en local, un proveedor real en Azure
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// Circuit breaker sobre el envío de avisos (BANK-73); versión del BOM de Spring Cloud
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
	// En Boot 4 Flyway necesita su starter y el módulo de PostgreSQL aparte
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// Contacto del cliente por gRPC con el token propio del servicio (client credentials, BANK-71)
	implementation 'org.springframework.grpc:spring-grpc-client-spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	// Explícito aunque webmvc ya lo traiga: sin Jackson, Spring Security lee la respuesta del token con Gson
	// (llega con gRPC), pierde expires_in y pide un token nuevo en cada llamada (spike BANK-66, K11)
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	// customers-service simulado como servidor gRPC en memoria (@AutoConfigureInProcessTransport)
	testImplementation 'org.springframework.grpc:spring-grpc-test'
	testImplementation 'org.springframework.grpc:spring-grpc-server-spring-boot-starter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Las pruebas no usan el config-server: perfil "test" (lee config-repo/ directo) y cliente de config
	// apagado desde el arranque (en application-test.yaml llegaría tarde: el import se procesa antes)
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.cloud.config.enabled', 'false'
	// El secreto del cliente local de Keycloak (infra/keycloak/bank-realm.json): config-repo no tiene valor por
	// defecto, y en application-test.yaml no serviría porque lo importado pisa al archivo que importa
	systemProperty 'NOTIFICATIONS_CLIENT_SECRET', 'notifications-local'
}
