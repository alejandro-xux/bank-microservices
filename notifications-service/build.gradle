plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
}

group = 'com.alejandro.bank'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Versiones de platform-bom en cada configuración que declara dependencias sin versión
	def bom = platform('com.alejandro.bank:platform-bom')
	implementation bom
	compileOnly bom
	annotationProcessor bom
	testCompileOnly bom
	testAnnotationProcessor bom

	// Avisos al cliente a partir de eventos de Kafka (E7). Sin API pública: Spring MVC solo para actuator
	// Clases generadas de contracts/transfer_events.proto (BANK-68)
	implementation 'com.alejandro.bank:contracts'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// En Boot 4 Flyway necesita su starter y el módulo de PostgreSQL aparte
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Las pruebas no usan el config-server: perfil "test" (lee config-repo/ directo) y cliente de config
	// apagado desde el arranque (en application-test.yaml llegaría tarde: el import se procesa antes)
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.cloud.config.enabled', 'false'
}
